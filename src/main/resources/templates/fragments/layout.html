<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Uniday</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --uniday-morado: #B541FA;
            --uniday-celeste: #4FD2E9;
            --uniday-blanco: #FFFFFF;
            --uniday-azul: #192584;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--uniday-blanco);
            background-image: url('/img/fondo.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #1a1a1a;
        }

        /* Velo blanco translúcido para que el fondo se vea suave y el texto siga legible */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.85);
            z-index: -1;
            pointer-events: none;
        }

        .bg-uniday-azul {
            background-color: var(--uniday-azul);
        }

        .text-uniday-azul {
            color: var(--uniday-azul);
        }

        .text-uniday-morado {
            color: var(--uniday-morado);
        }

        .btn-uniday {
            background-color: var(--uniday-morado);
            border-color: var(--uniday-morado);
            color: #fff;
            font-weight: 600;
        }

        .btn-uniday:hover {
            background-color: #9b2fd8;
            border-color: #9b2fd8;
            color: #fff;
        }

        .btn-uniday-celeste {
            background-color: var(--uniday-celeste);
            border-color: var(--uniday-celeste);
            color: var(--uniday-azul);
            font-weight: 600;
        }

        .btn-uniday-celeste:hover {
            background-color: #3fbcd4;
            border-color: #3fbcd4;
        }

        .card-uniday {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(25, 37, 132, 0.15);
        }

        .navbar-uniday {
            background-color: var(--uniday-azul);
        }

        .navbar-uniday .navbar-brand,
        .navbar-uniday .nav-link {
            color: var(--uniday-blanco);
            font-weight: 600;
        }

        .navbar-uniday .nav-link:hover {
            color: var(--uniday-celeste);
        }

        .badge-activo {
            background-color: var(--uniday-celeste);
            color: var(--uniday-azul);
        }

        /* Tarjeta del semestre activo (Actual): más visible con borde morado y fondo pastel */
        .card-activa {
            border: 2px solid var(--uniday-morado) !important;
            background: linear-gradient(135deg, #faf5ff 0%, #eefafd 100%) !important;
            box-shadow: 0 10px 30px rgba(181, 65, 250, 0.22);
        }

        /* Insignia del semestre finalizado */
        .badge-finalizado {
            background-color: #e9ecef;
            color: #6c757d;
        }

        /* Insignia azul Uniday (notas/promedios >= 4.0) */
        .badge-uniday-azul {
            background-color: var(--uniday-azul);
            color: #fff;
        }

        /* Toasts */
        .toast-uniday {
            background-color: var(--uniday-azul);
            color: #fff;
        }

        .toast-error {
            background-color: #dc3545;
            color: #fff;
        }

        /* Icono de materia en la lista */
        .materia-icono {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            flex-shrink: 0;
        }
    </style>
</head>

<body th:fragment="body">

<nav class="navbar navbar-expand-lg navbar-dark navbar-uniday">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <img th:src="@{/img/Uniday.png}" alt="Uniday" width="36" height="36" class="me-2 rounded">
            <span>Uniday</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarUniday"
                aria-controls="navbarUniday" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarUniday">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0" th:if="${session.usuarioId != null}">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/horarios}">Horario</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/calendario}">Calendario</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/notas}">Notas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/asistencia}">Asistencia</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/materias}">Materias</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/semestres}">Semestres</a>
                </li>
            </ul>
            <ul class="navbar-nav align-items-center" th:if="${session.usuarioId != null}">
                <li class="nav-item me-3 d-none d-md-flex align-items-center" th:if="${session.nombreUsuario != null}">
                    <span class="navbar-text text-white-50 p-0">Hola <strong class="text-white" th:text="${session.nombreUsuario}">Alumno</strong>, otro día en Uniday</span>
                </li>
                <li class="nav-item ms-2">
                    <form class="d-flex" th:action="@{/logout}" method="post">
                        <button class="btn btn-uniday-celeste" type="submit">Cerrar sesión</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4"></main>

<!-- Avisos (toasts): mismos en todas las páginas; definidos una sola vez debajo -->
<div th:replace="~{fragments/layout :: toasts}"></div>

<div th:fragment="toasts">
    <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3" style="z-index: 1080;">
        <div id="toastProximamente" class="toast align-items-center toast-uniday border-0" role="status" aria-live="polite" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    Próximamente
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
            </div>
        </div>
        <div id="toastFlash" class="toast align-items-center border-0"
             th:if="${success != null or error != null}"
             th:classappend="${success != null ? 'toast-uniday' : 'toast-error'}"
             role="status" aria-live="polite" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fw-semibold" th:text="${success != null ? success : error}">Mensaje</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
            </div>
        </div>
    </div>
    <script>
        function mostrarProximamente() {
            var toastEl = document.getElementById('toastProximamente');
            var toast = bootstrap.Toast.getOrCreateInstance(toastEl, { delay: 2500 });
            toast.show();
        }

        window.addEventListener('DOMContentLoaded', function () {
            var flashEl = document.getElementById('toastFlash');
            if (flashEl) {
                var toast = bootstrap.Toast.getOrCreateInstance(flashEl, { delay: 3000 });
                toast.show();
            }
        });
    </script>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
