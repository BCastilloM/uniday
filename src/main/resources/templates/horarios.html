<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Uniday - Horario')}"></head>
<body>

<div th:replace="~{fragments/layout :: body}"></div>

<style>
    .horario-scroll {
        overflow-x: auto;
    }

    .grilla-horario {
        display: flex;
        gap: 14px;
        min-width: 560px;
        padding: 2px 4px 8px;
    }

    .col-horas,
    .col-dia {
        display: flex;
        flex-direction: column;
    }

    .col-horas {
        flex: 0 0 52px;
    }

    /* Tarjeta grande del horario con los colores de la paleta, suaves */
    .card-horario {
        background: linear-gradient(135deg, #efe3fb 0%, #dff1f8 100%);
        border: 1px solid #e6dcf2;
        border-radius: 1rem;
        box-shadow: 0 10px 30px rgba(25, 37, 132, .12);
    }

    .col-dia {
        flex: 1 1 0;
        min-width: 100px;
        border-left: 1px solid rgba(25, 37, 132, .12);
    }

    .cabecera-horas {
        height: 44px;
        flex: 0 0 44px;
    }

    .cabecera-dia {
        height: 36px;
        flex: 0 0 36px;
        margin: 4px 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 12.5px;
        letter-spacing: .04em;
        color: var(--uniday-azul);
        background: linear-gradient(135deg, rgba(181, 65, 250, .16) 0%, rgba(79, 210, 233, .22) 100%);
        border: 1px solid rgba(25, 37, 132, .08);
        border-radius: 999px;
    }

    .cuerpo-horas,
    .cuerpo-dia {
        position: relative;
    }

    .cuerpo-dia {
        background: rgba(255, 255, 255, .55);
        border-radius: 12px;
    }

    .marco-hora {
        position: absolute;
        left: 0;
        right: 0;
        height: 72px;
        border-top: 1px solid rgba(25, 37, 132, .10);
    }

    .hora-label {
        position: absolute;
        left: 0;
        right: 0;
        height: 72px;
        display: flex;
        justify-content: flex-end;
        align-items: flex-start;
        padding-top: 3px;
        padding-right: 8px;
        font-size: 12px;
        font-weight: 600;
        color: rgba(25, 37, 132, .62);
        border-top: 1px solid rgba(25, 37, 132, .10);
    }

    .bloque {
        position: absolute;
        border-radius: 10px;
        background: color-mix(in srgb, var(--bc, var(--uniday-azul)) 10%, white);
        color: var(--uniday-azul);
        box-shadow: 0 3px 8px rgba(25, 37, 132, .12);
        border: 1px solid color-mix(in srgb, var(--bc, var(--uniday-azul)) 24%, white);
        border-left: 4px solid var(--bc, var(--uniday-azul));
        padding: 8px 12px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .bloque-materia {
        font-size: 13.5px;
        font-weight: 700;
        line-height: 1.25;
        padding-right: 18px;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .bloque-ico {
        font-size: 15px;
        color: #fff;
        background: var(--bc, var(--uniday-azul));
        border-radius: 7px;
        width: 26px;
        height: 26px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
    }

    .bloque-hora {
        font-size: 13px;
        color: var(--uniday-azul);
        margin-top: 5px;
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
    }

    .bloque-sala {
        font-size: 12.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .03em;
        color: var(--uniday-morado);
        display: inline-flex;
        align-items: center;
        gap: 4px;
    }

    .bloque-sala i {
        font-size: 13.5px;
    }

    .bloque .dropdown {
        position: absolute;
        top: 2px;
        right: 2px;
    }

    .bloque .btn-puntos {
        color: var(--uniday-azul);
        font-size: 16px;
        line-height: 1;
        padding: 4px 6px;
    }
</style>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <div class="d-flex align-items-center">
                <h1 class="text-uniday-azul fw-bold mb-0">Horario</h1>
                <span class="badge badge-activo ms-2" th:text="${semestre.nombre}">Semestre</span>
            </div>
            <p class="text-muted mb-0">Horario semanal del semestre</p>
        </div>
        <a th:href="@{/horarios/nuevo}" class="btn btn-uniday">+ Nuevo horario</a>
    </div>

    <div class="card card-horario p-3" th:if="${!horas.isEmpty()}">
        <div class="horario-scroll">
            <div class="grilla-horario">

                <div class="col-horas">
                    <div class="cabecera-horas"></div>
                    <div class="cuerpo-horas" th:style="'height:' + ${totalPx} + 'px'">
                        <div class="hora-label" th:each="h, st : ${horas}"
                             th:text="${h}"
                             th:style="'top:' + ${st.index * rowAltura} + 'px'">08:00</div>
                    </div>
                </div>

                <!-- Solo los días de la semana que tienen clases -->
                <div class="col-dia" th:each="e : ${bloquesPorDia}">
                    <div class="cabecera-dia" th:text="${diasNombres[e.key - 1]}">Lun</div>
                    <div class="cuerpo-dia" th:style="'height:' + ${totalPx} + 'px'">

                        <div class="marco-hora" th:each="h, hs : ${horas}"
                             th:style="'top:' + ${hs.index * rowAltura} + 'px'"></div>

                        <div class="bloque"
                             th:each="b : ${e.value}"
                             th:style="'--bc:' + ${materiaColores[b.materiaId] != null ? materiaColores[b.materiaId] : 'var(--uniday-azul)'} + '; top:' + ${topPx[b.id]} + 'px; height:' + ${heightPx[b.id]} + 'px; left: calc(' + ${leftPct[b.id]} + '% + 4px); width: calc(' + ${widthPct[b.id]} + '% - 8px)'">
                            <span class="bloque-materia">
                                <i class="bi bloque-ico"
                                   th:classappend="${materiaIconos[b.materiaId] != null ? materiaIconos[b.materiaId] : 'bi-book'}"></i>
                                <span th:text="${materiaNombres[b.materiaId]}">Programación</span>
                            </span>
                            <span class="bloque-hora">
                                <span th:text="${b.horaInicio} + ' - ' + ${b.horaFin}">08:30 - 10:00</span>
                                <span class="bloque-sala" th:if="${b.sala != null and !b.sala.isBlank()}">
                                    <i class="bi bi-door-open"></i>
                                    <span th:text="${b.sala}">Sala 12</span>
                                </span>
                                <span th:if="${materiaProfesores[b.materiaId] != null and !materiaProfesores[b.materiaId].isBlank()}"
                                      th:text="${' · ' + materiaProfesores[b.materiaId]}">Prof. Nombre</span>
                            </span>
                            <div class="dropdown">
                                <button class="btn btn-puntos border-0 bg-transparent" type="button"
                                        data-bs-toggle="dropdown" aria-expanded="false" title="Opciones">
                                    <i class="bi bi-three-dots-vertical"></i>
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end">
                                    <li>
                                        <a class="dropdown-item" th:href="@{/horarios/{id}/editar(id=${b.id})}">
                                            <i class="bi bi-pencil me-2 text-muted"></i>Editar</a>
                                    </li>
                                    <li>
                                        <form th:action="@{/horarios/{id}/eliminar(id=${b.id})}" method="post"
                                              onsubmit="return confirm('¿Eliminar este horario?');">
                                            <button type="submit" class="dropdown-item text-danger">
                                                <i class="bi bi-trash me-2 text-muted"></i>Eliminar
                                            </button>
                                        </form>
                                    </li>
                                </ul>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <div th:if="${horas.isEmpty()}">
        <div class="text-center py-5">
            <p class="text-muted fs-5">Este semestre no tiene horarios todavía.</p>
            <a th:href="@{/horarios/nuevo}" class="btn btn-uniday">Agregar horario</a>
        </div>
    </div>
</div>

</body>
</html>
