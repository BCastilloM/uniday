<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Uniday - Semestre')}"></head>
<body>

<div th:replace="~{fragments/layout :: body}"></div>

<div class="container" style="max-width: 560px;">
    <h1 class="text-uniday-azul fw-bold mb-4" th:text="${titulo}">Semestre</h1>

    <div class="card card-uniday p-4">
        <form th:action="${action}" method="post">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" name="nombre"
                       th:value="${semestre.nombre}" placeholder="Ej: 2025-1" required>
            </div>
            <div class="mb-3">
                <label for="fechaInicio" class="form-label">Fecha de inicio</label>
                <input type="date" class="form-control" id="fechaInicio" name="fechaInicio"
                       th:value="${semestre.fechaInicio}">
            </div>
            <div class="mb-3">
                <label for="fechaFin" class="form-label">Fecha de fin</label>
                <input type="date" class="form-control" id="fechaFin" name="fechaFin"
                       th:value="${semestre.fechaFin}">
                <div class="form-text">La fecha de término debe ser posterior a la fecha de inicio.</div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-uniday">Guardar</button>
                <a th:href="@{/semestres}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<script>
    const fInicio = document.getElementById('fechaInicio');
    const fFin = document.getElementById('fechaFin');
    if (fInicio && fFin) {
        fInicio.addEventListener('change', () => {
            if (fInicio.value) {
                fFin.min = fInicio.value;
            }
        });
        fFin.addEventListener('change', () => {
            if (fFin.value) {
                fInicio.max = fFin.value;
            }
        });
    }
</script>

</body>
</html>
