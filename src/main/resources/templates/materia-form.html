<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Uniday - Materia')}"></head>
<body>

<div th:replace="~{fragments/layout :: body}"></div>

<div class="container" style="max-width: 560px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <a th:href="@{/materias(semestre=${semestre.id})}" class="text-uniday-morado text-decoration-none">&larr; Volver a materias</a>
            <h1 class="text-uniday-azul fw-bold mb-0" th:text="${titulo}">Materia</h1>
            <p class="text-muted mb-0" th:text="'Semestre: ' + ${semestre.nombre}">Semestre</p>
        </div>
    </div>

    <div class="card card-uniday p-4">
        <form th:action="${action}" method="post">
            <input type="hidden" name="semestreId" th:value="${semestre.id}">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" name="nombre"
                       th:value="${materia.nombre}" placeholder="Ej: Cálculo I" required>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="codigo" class="form-label">Código de materia</label>
                    <input type="text" class="form-control" id="codigo" name="codigo"
                           th:value="${materia.codigo}" placeholder="Ej: MAT-101">
                </div>
                <div class="col-md-6 mt-3 mt-md-0">
                    <label for="creditos" class="form-label">Créditos (SCT)</label>
                    <input type="number" class="form-control" id="creditos" name="creditos"
                           th:value="${materia.creditos}" min="0" max="60" placeholder="Ej: 5">
                </div>
            </div>
            <div class="mb-3">
                <label for="profesor" class="form-label">Profesor</label>
                <input type="text" class="form-control" id="profesor" name="profesor"
                       th:value="${materia.profesor}" placeholder="Ej: Dra. Andrea Morales">
            </div>
            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea class="form-control" id="descripcion" name="descripcion" rows="3"
                          th:text="${materia.descripcion}" placeholder="Resumen de contenidos o temas principales..."></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Color</label>
                <div class="d-flex align-items-center gap-3 mb-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="currentColor" id="colorPreviewIcon"
                         class="flex-shrink-0" th:style="'color: ' + ${colorActual} + ';'" viewBox="0 0 16 16">
                        <path d="M1 2.828c.885-.37 2.154-.769 3.388-.893 1.33-.134 2.458.063 3.112.752v9.746c-.935-.53-2.12-.603-3.213-.493-1.18.12-2.37.461-3.287.811V2.828zm7.5-.141c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492V2.687zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 0 0 .78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0 0 16 13.5v-11a.5.5 0 0 0-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.81 8.985.936 8 1.783z"/>
                    </svg>
                    <span class="text-muted">Elige un color</span>
                </div>
                <div class="d-flex flex-wrap gap-2" id="colorSwatches">
                    <button type="button" class="swatch rounded-circle border-0"
                            th:each="color : ${colores}"
                            th:style="'background-color: ' + ${color} + ';'"
                            th:attr="data-color=${color}"
                            th:classappend="${colorActual == color} ? 'swatch-selected' : ''"
                            aria-label="Color"></button>
                </div>
                <input type="hidden" id="colorHex" name="colorHex" th:value="${colorActual}">
            </div>
            <div class="mb-3">
                <label for="asistenciaExigida" class="form-label">Asistencia exigida (%)</label>
                <input type="number" class="form-control" id="asistenciaExigida" name="asistenciaExigida"
                       th:value="${materia.asistenciaExigida}" min="0" max="100">
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-uniday">Guardar</button>
                <a th:href="@{/materias(semestre=${semestre.id})}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<script>
    document.getElementById('colorSwatches').addEventListener('click', function (event) {
        var swatch = event.target.closest('.swatch');
        if (!swatch) {
            return;
        }
        // Marco el swatch elegido
        this.querySelectorAll('.swatch').forEach(function (b) {
            b.classList.remove('swatch-selected');
        });
        swatch.classList.add('swatch-selected');
        // Actualizo el input oculto y el icono de vista previa
        document.getElementById('colorHex').value = swatch.dataset.color;
        document.getElementById('colorPreviewIcon').style.color = swatch.dataset.color;
    });
</script>

<style>
    .swatch {
        width: 34px;
        height: 34px;
        cursor: pointer;
        transition: transform 0.1s ease;
    }
    .swatch:hover {
        transform: scale(1.12);
    }
    .swatch-selected {
        outline: 3px solid var(--uniday-azul);
        outline-offset: 2px;
    }
</style>

</body>
</html>
