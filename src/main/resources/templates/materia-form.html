<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Uniday - Materia')}"></head>
<body>

<div th:replace="~{fragments/layout :: body}"></div>

<div class="container" style="max-width: 560px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <a th:href="@{/materias(semestre=${semestre.id})}" class="text-uniday-morado text-decoration-none">&larr; Volver a materias</a>
            <h1 class="text-uniday-azul fw-bold mb-0" th:text="${titulo}">Materia</h1>
            <p class="text-muted mb-0" th:text="'Semestre: ' + ${semestre.nombre}">Semestre</p>
        </div>
    </div>

    <div class="card card-uniday p-4">
        <form th:action="${action}" method="post">
            <input type="hidden" name="semestreId" th:value="${semestre.id}">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" name="nombre"
                       th:value="${materia.nombre}" placeholder="Ej: Cálculo I" required>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="codigo" class="form-label">Código de materia</label>
                    <input type="text" class="form-control" id="codigo" name="codigo"
                           th:value="${materia.codigo}" placeholder="Ej: MAT-101">
                </div>
                <div class="col-md-6 mt-3 mt-md-0">
                    <label for="creditos" class="form-label">Créditos (SCT)</label>
                    <input type="number" class="form-control" id="creditos" name="creditos"
                           th:value="${materia.creditos}" min="0" max="60" placeholder="Ej: 5">
                </div>
            </div>
            <div class="mb-3">
                <label for="profesor" class="form-label">Profesor</label>
                <input type="text" class="form-control" id="profesor" name="profesor"
                       th:value="${materia.profesor}" placeholder="Ej: Dra. Andrea Morales">
            </div>
            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea class="form-control" id="descripcion" name="descripcion" rows="3"
                          th:text="${materia.descripcion}" placeholder="Resumen de contenidos o temas principales..."></textarea>
            </div>
            <div class="mb-3">
                <label for="asistenciaExigida" class="form-label">Asistencia exigida (%)</label>
                <input type="number" class="form-control" id="asistenciaExigida" name="asistenciaExigida"
                       th:value="${materia.asistenciaExigida}" min="0" max="100">
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-uniday">Guardar</button>
                <a th:href="@{/materias(semestre=${semestre.id})}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
