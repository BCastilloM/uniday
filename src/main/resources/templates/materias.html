<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Uniday - Materias')}"></head>
<body>

<div th:replace="~{fragments/layout :: body}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <div class="d-flex align-items-center">
                <h1 class="text-uniday-azul fw-bold mb-0" th:text="${semestre.nombre}">Semestre</h1>
                <span class="badge badge-activo ms-2">Activo</span>
            </div>
            <p class="text-muted mb-0" th:if="${semestre.fechaInicio != null}">
                Desde <span th:text="${semestre.fechaInicio}"></span>
                <span th:if="${semestre.fechaFin != null}"> hasta <span th:text="${semestre.fechaFin}"></span></span>
            </p>
            <p class="text-muted mb-0">Materias del semestre</p>
        </div>
        <a th:href="@{/materias/nueva(semestreId=${semestre.id})}" class="btn btn-uniday">+ Nueva materia</a>
    </div>

    <div class="row" th:if="${!materias.isEmpty()}">
        <div class="col-md-6 mb-3" th:each="materia : ${materias}">
            <div class="card card-uniday h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <div class="d-flex align-items-center flex-wrap gap-2">
                            <h5 class="card-title fw-bold mb-0" th:text="${materia.nombre}">Materia</h5>
                            <span class="badge bg-light text-dark border" th:if="${materia.codigo != null and !materia.codigo.isBlank()}"
                                  th:text="${materia.codigo}">COD-101</span>
                            <span class="badge bg-primary-subtle text-primary border border-primary-subtle" th:if="${materia.creditos > 0}"
                                  th:text="${materia.creditos} + ' Créditos'">5 Créditos</span>
                        </div>
                        <div class="dropdown">
                            <button class="btn btn-sm" type="button" data-bs-toggle="dropdown" aria-expanded="false"
                                    title="Opciones" style="color: var(--uniday-azul);">
                                <i class="bi bi-three-dots-vertical fs-5"></i>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <a class="dropdown-item" th:href="@{/materias/{id}/editar(id=${materia.id})}">
                                        <i class="bi bi-pencil me-2 text-muted"></i>Editar</a>
                                </li>
                                <li>
                                    <form th:action="@{/materias/{id}/eliminar(id=${materia.id})}" method="post"
                                          onsubmit="return confirm('¿Eliminar esta materia?');">
                                        <button type="submit" class="dropdown-item text-danger">
                                            <i class="bi bi-trash me-2 text-muted"></i>Eliminar
                                        </button>
                                    </form>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <p class="text-muted mb-2 small" th:if="${materia.descripcion != null and !materia.descripcion.isBlank()}"
                       th:text="${materia.descripcion}">Descripción de la materia...</p>
                    <p class="text-muted mb-1" th:if="${materia.profesor != null and !materia.profesor.isBlank()}">
                        Profesor: <span th:text="${materia.profesor}">Profesor</span>
                    </p>
                    <p class="text-muted mb-0">
                        Asistencia exigida: <span th:text="${materia.asistenciaExigida} + '%'">75%</span>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${materias.isEmpty()}">
        <div class="text-center py-5">
            <p class="text-muted fs-5">Este semestre no tiene materias todavía.</p>
            <a th:href="@{/materias/nueva(semestreId=${semestre.id})}" class="btn btn-uniday">Agregar materia</a>
        </div>
    </div>
</div>

</body>
</html>
