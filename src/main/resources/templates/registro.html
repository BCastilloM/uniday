<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Uniday - Registro')}"></head>
<body>

<div class="bg-uniday-azul" style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div class="container" style="max-width: 460px;">
        <div class="card card-uniday p-4">
            <div class="text-center mb-4">
                <img th:src="@{/img/Uniday.png}" alt="Uniday" width="80" height="80" class="mb-3">
                <h1 class="text-uniday-azul fw-bold mb-1">Crear cuenta</h1>
                <p class="text-muted mb-0">Únete a Uniday</p>
            </div>

            <form th:action="@{/registro}" method="post">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                </div>
                <button type="submit" class="btn btn-uniday w-100">Registrarme</button>
            </form>

            <p class="text-center mt-3 mb-0">
                ¿Ya tienes cuenta? <a th:href="@{/login}" class="text-uniday-morado fw-semibold">Inicia sesión</a>
            </p>
        </div>
    </div>
</div>

<!-- Avisos (toasts): mismo fragmento que el resto de la app -->
<div th:replace="~{fragments/layout :: toasts}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
