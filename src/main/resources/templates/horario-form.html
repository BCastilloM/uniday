<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Uniday - Horario')}"></head>
<body>

<div th:replace="~{fragments/layout :: body}"></div>

<div class="container" style="max-width: 560px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <a th:href="@{/horarios}" class="text-uniday-morado text-decoration-none">&larr; Volver a horarios</a>
            <h1 class="text-uniday-azul fw-bold mb-0" th:text="${titulo}">Horario</h1>
        </div>
    </div>

    <div class="card card-uniday p-4">
        <form th:action="${action}" method="post">
            <div class="mb-3">
                <label for="materiaId" class="form-label">Materia</label>
                <select class="form-select" id="materiaId" name="materiaId" required>
                    <option value="" disabled>Selecciona una materia</option>
                    <option th:each="materia : ${materias}" th:value="${materia.id}" th:text="${materia.nombre}"
                            th:selected="${horario.materiaId == materia.id}">Materia</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="diaSemana" class="form-label">Día</label>
                <select class="form-select" id="diaSemana" name="diaSemana" required>
                    <option value="" disabled>Selecciona un día</option>
                    <option th:each="entry : ${dias}" th:value="${entry.key}" th:text="${entry.value}"
                            th:selected="${horario.diaSemana == entry.key}">Lunes</option>
                </select>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="horaInicio" class="form-label">Hora de inicio</label>
                    <input type="time" class="form-control" id="horaInicio" name="horaInicio"
                           th:value="${horario.horaInicio}" required>
                </div>
                <div class="col-md-6 mt-3 mt-md-0">
                    <label for="horaFin" class="form-label">Hora de fin</label>
                    <input type="time" class="form-control" id="horaFin" name="horaFin"
                           th:value="${horario.horaFin}" required>
                </div>
            </div>
            <div class="mb-3">
                <label for="sala" class="form-label">Sala</label>
                <input type="text" class="form-control" id="sala" name="sala"
                       th:value="${horario.sala}" placeholder="Ej: Sala 12">
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-uniday">Guardar</button>
                <a th:href="@{/horarios}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
