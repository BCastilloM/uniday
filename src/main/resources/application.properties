spring.application.name=uniday

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/uniday?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=uniday
spring.datasource.password=uniday

# JPA / Hibernate
# validate: la app NO crea ni modifica el esquema. La base de datos se crea
# únicamente ejecutando sql/uniday.sql (MySQL local / Workbench / XAMPP, o vía
# docker-compose en el arranque del contenedor). Si el esquema no coincide con
# las entidades, el arranque falla en vez de mutar la BD.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# DataSeeder (config/DataSeeder.java) desactivado por defecto: los datos demo
# vienen de sql/uniday.sql. Para reactivarlo: app.seed.enabled=true
app.seed.enabled=false

# Codificación
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
